name: Main

on:
  pull_request:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        cache: true
        cache-dependency-path: go.sum
    - run: go version

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -coverprofile=coverage.out -covermode=atomic -v ./...

    - name: Coverage summary
      run: go tool cover -func=coverage.out

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v7
      with:
        name: coverage
        path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'
        cache: true
        cache-dependency-path: go.sum

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest

  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
      with:
        go-version: '1.27'
        cache: true
        cache-dependency-path: go.sum

    - name: install hadolint
      env:
        HADOLINT_VERSION: v2.15.1
        HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      run: |
        mkdir -p "$RUNNER_TEMP/bin"
        curl -fsSLo "$RUNNER_TEMP/bin/hadolint" \
          "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-linux-x86_64"
        echo "${HADOLINT_SHA256}  $RUNNER_TEMP/bin/hadolint" | sha256sum --check
        chmod +x "$RUNNER_TEMP/bin/hadolint"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

    - name: install Trivy
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567  # v0.3.1
      with:
        version: v0.76.2
        cache: true

    - name: run pre-commit
      run: pipx run pre-commit==4.6.0 run --all-files
